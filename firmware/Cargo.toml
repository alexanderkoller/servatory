[package]
name = "servatory-firmware"
build = "build.rs"
description = "M5Stick S3 firmware for a USB and Wi-Fi server health display"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
version = "0.3.0"

[workspace]

[dependencies]
allocator-api2 = { version = "0.3.0", default-features = false, features = ["alloc"] }
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-net = { version = "0.8.0", features = ["dhcpv4", "dhcpv4-hostname", "dns", "medium-ethernet", "multicast", "tcp", "udp"] }
embassy-sync = "0.7.2"
embassy-time = "0.5.0"
critical-section = "1.2.0"
base64 = { version = "0.21.7", default-features = false, features = ["alloc"] }
embedded-graphics = "0.8.2"
embedded-hal-bus = "0.3.0"
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"
edge-dhcp = "0.7.0"
edge-http = "0.7.0"
edge-mdns = "0.7.0"
edge-nal = "0.6.0"
edge-nal-embassy = "0.8.1"
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-alloc = { version = "0.10.0", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
esp-radio = { version = "0.18.0", features = ["esp32s3", "wifi"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3"] }
esp-storage = { version = "0.8.0", features = ["esp32s3"] }
heapless = "0.9.2"
heapless08 = { package = "heapless", version = "0.8.0" }
mipidsi = "0.10.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
qrcodegen-no-heap = "1.8.1"
reqwless = { version = "0.14.0", default-features = false, features = ["embedded-tls", "rsa"] }
der = { version = "0.8.1", default-features = false, features = ["heapless"] }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
servatory-protocol = { path = "../protocol" }
static_cell = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[lints.rust]
unsafe_code = "deny"
