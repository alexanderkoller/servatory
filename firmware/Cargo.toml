[package]
name = "health-stick-firmware"
description = "M5Stick S3 firmware for a USB-connected server display"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
version = "0.1.0"

[workspace]

[dependencies]
# Deliberately do not add esp-radio/esp-wifi: this is a USB-only appliance.
embedded-graphics = "0.8.2"
embedded-hal-bus = "0.3.0"
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-alloc = { version = "0.10.0", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }
heapless = "0.9.2"
mipidsi = "0.10.0"
health-stick-protocol = { path = "../protocol" }
static_cell = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

[lints.rust]
unsafe_code = "forbid"
