[package]
name = "health-stick-host"
build = "build.rs"
description = "Linux-side USB updater for the M5Stick S3 server display"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
serialport = { version = "4.8.1", default-features = false }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
health-stick-protocol = { path = "../protocol" }

[lints]
workspace = true
